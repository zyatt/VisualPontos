org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Limita a memória do Kotlin daemon separadamente (evita que ele seja
# morto pelo sistema operacional por falta de memória).
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Desativa o Kotlin incremental compilation daemon paralelo, que é uma
# fonte comum de instabilidade em máquinas com pouca memória livre.
kotlin.incremental=false