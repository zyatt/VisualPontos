name: visual_premium
description: Visual Premium — sistema de gestão
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.6.1
  google_fonts: ^6.2.1
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  cupertino_icons: ^1.0.8
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0
  flutter_dotenv: ^6.0.0
  open_filex: ^4.5.0
  intl: ^0.19.0
  window_manager: ^0.4.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - .env

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21